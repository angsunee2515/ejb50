<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Everything Jingle Bell 50+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@500;600&display=swap">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{
  --bg:#eef2ef; --surface:#fff; --surface-2:#f5f8f6; --line:#d3ddd8;
  --ink:#1c2a28; --muted:#5b6b67; --faint:#8a9894;
  --accent:#2d6a5d; --accent-soft:#dcebe6; --accent-ink:#1f5046; --on-accent:#fff;
  --brass:#8a6418; --brass-soft:#f4ead3; --stop:#b3372f; --stop-soft:#f8e2df;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;font-size:16px;line-height:1.55;padding:16px 16px calc(40px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:"Mitr","IBM Plex Sans Thai",sans-serif;font-weight:600;margin:0}
h1{font-size:22px;line-height:1.3}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.hello{font-size:14px;color:var(--accent-ink);margin-top:4px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;position:sticky;top:0;z-index:3;background:var(--bg);padding:6px 0}
.tab{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:8px 2px;font:inherit;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.3}
.tab .ic{font-size:21px;line-height:1.1}
.tab .cnt{font-size:11.5px;color:var(--faint)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab[aria-selected="true"] .cnt{color:var(--on-accent)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px;display:flex;flex-direction:column;gap:14px}
.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.meter{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.status{font-size:14px;color:var(--muted)}
.gate{border-radius:12px;padding:11px 14px;font-weight:600;font-size:15px}
.gate.stop{background:var(--stop-soft);color:var(--stop)}
.gate.go{background:var(--accent-soft);color:var(--accent-ink)}
.gate small{display:block;font-weight:400;font-size:13px;margin-top:2px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.item{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);min-height:52px}
.item input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:0 0 26px;height:26px;border-radius:8px;border:2px solid var(--faint);display:flex;align-items:center;justify-content:center;background:var(--surface)}
.box svg{width:16px;height:16px;opacity:0}
.item.on{background:var(--accent-soft);border-color:var(--accent)}
.item.on .box{background:var(--accent);border-color:var(--accent)}
.item.on .box svg{opacity:1}
.item.on .txt{color:var(--muted);text-decoration:line-through}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.photo{border:2px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.photo.has{border-style:solid;border-color:var(--accent)}
.photo .lbl{font-weight:600}
.photo img{border-radius:10px;max-height:240px;object-fit:cover;width:100%}
.camera{position:relative;display:flex;justify-content:center;border-radius:12px;padding:12px;background:var(--surface-2);border:1px solid var(--line);font-weight:600}
.camera input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:14px;color:var(--brass)}
textarea{font:inherit;font-size:15px;min-height:58px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn{appearance:none;font:inherit;font-size:15px;font-weight:600;border-radius:12px;padding:11px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn:disabled{opacity:.45}
.btn-main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:16px;padding:14px 16px}
.toast{border-radius:12px;padding:10px 14px;font-size:14px}
.toast.ok{background:var(--accent-soft);color:var(--accent-ink)}
.toast.warn{background:var(--brass-soft);color:var(--brass)}
.lastpark{background:var(--brass-soft);border-radius:14px;padding:12px;display:flex;gap:12px;align-items:center}
.lastpark img{width:84px;height:84px;object-fit:cover;border-radius:10px}
.lastpark b{color:var(--brass)}
.log{padding:10px 12px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:14px;display:flex;flex-direction:column;gap:2px}
.log .when{font-weight:600}
.log .note{color:var(--muted);overflow-wrap:anywhere}
.tip{font-size:13.5px;color:var(--muted)}
.center{text-align:center;padding:40px 0;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="appName">Everything Jingle Bell 50+</h1>
    <div class="sub" id="subtitle"></div>
    <div class="hello" id="hello"></div>
  </header>
  <div class="center" id="loading">กำลังเปิดแอป…</div>

  <div id="app" hidden>
    <nav class="tabs" id="tabs"></nav>
    <div class="lastpark" id="lastPark" hidden></div>
    <section class="panel" id="panel">
      <div class="head"><h2 id="ptitle"></h2><span class="status" id="status"></span></div>
      <div class="meter"><span id="bar"></span></div>
      <div class="gate stop" id="gate"></div>
      <ul id="list"></ul>
      <div class="photo" id="photoBox">
        <div class="lbl" id="photoLabel"></div>
        <img id="photoPreview" alt="รูปที่ถ่ายไว้" hidden>
        <label class="camera"><span id="cameraText">📷 ถ่ายรูป</span>
          <input type="file" id="photoInput" accept="image/*" capture="environment">
        </label>
      </div>
      <div class="field"><label for="noteText" id="noteLabel"></label><textarea id="noteText"></textarea></div>
      <button class="btn btn-main" id="saveBtn" disabled>บันทึก พร้อมออก</button>
      <div class="toast" id="toast" hidden></div>
      <button class="btn" id="resetBtn">ล้างติ๊ก เริ่มรอบใหม่</button>
    </section>
    <section class="panel" style="margin-top:14px">
      <div class="head"><h3>ประวัติของฉัน</h3><button class="btn" id="histBtn" style="padding:6px 12px;font-size:13.5px">ดูประวัติ</button></div>
      <div id="hist"></div>
    </section>
  </div>
</div>

<script>
/* ====== ตั้งค่า: แก้ 2 บรรทัดนี้ ====== */
const LIFF_ID = '2011762160-hUu5FoS2';            // เช่น 2001234567-AbCdEfGh
const API_URL = 'https://script.google.com/macros/s/AKfycbw4dLq00wmi9eCKOjYlx6eOjtM-LLZuKtOgBLzfqjUjeM7tijeg7bOZhO2UwNZKWblsHg/exec'; // ลงท้ายด้วย /exec
/* =================================== */

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const check = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
let CFG = null, cur = null, busy = false, photo = {};
let local = loadLocal();

function loadLocal(){ try{ return JSON.parse(localStorage.getItem('ejb50')) || {ticks:{}, notes:{}, last:{}}; }catch(e){ return {ticks:{}, notes:{}, last:{}}; } }
function saveLocal(){ try{ localStorage.setItem('ejb50', JSON.stringify(local)); }catch(e){} }

async function api(body){
  const res = await fetch(API_URL, {method:'POST', body: JSON.stringify(body)});
  return res.json();
}

async function start(){
  try{
    await liff.init({liffId: LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    try{ const p = await liff.getProfile(); $('hello').textContent = 'สวัสดีค่ะ คุณ' + p.displayName; }catch(e){}
    const r = await api({action:'config'});
    if(!r.ok) throw new Error(r.error);
    CFG = r.config;
    $('appName').textContent = CFG.appName; document.title = CFG.appName;
    $('subtitle').textContent = CFG.subtitle || '';
    cur = local.cur && CFG.tabs.some(t=>t.key===local.cur) ? local.cur : (CFG.tabs[0] && CFG.tabs[0].key);
    $('loading').hidden = true; $('app').hidden = false;
    render();
  }catch(err){
    $('loading').textContent = 'เปิดแอปไม่สำเร็จ กรุณาปิดแล้วเปิดใหม่อีกครั้งค่ะ';
  }
}

function tab(){ return CFG.tabs.find(t=>t.key===cur); }
function ticks(){ const T = tab(); local.ticks[cur] = (local.ticks[cur]||[]).slice(0,T.items.length); while(local.ticks[cur].length<T.items.length) local.ticks[cur].push(false); return local.ticks[cur]; }
function ready(){ const k = ticks(); return k.length>0 && k.every(Boolean) && !!photo[cur]; }

function render(){
  $('tabs').innerHTML = CFG.tabs.map(t=>{
    const k = (local.ticks[t.key]||[]).filter(Boolean).length;
    return `<button class="tab" aria-selected="${t.key===cur}" data-k="${esc(t.key)}"><span class="ic">${esc(t.icon)}</span>${esc(t.name)}<span class="cnt">${k}/${t.items.length}</span></button>`;
  }).join('');
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ cur=b.dataset.k; local.cur=cur; saveLocal(); hideToast(); render(); });
  const T = tab(), K = ticks(), done = K.filter(Boolean).length, n = K.length;
  $('ptitle').textContent = T.icon + ' ' + T.name;
  $('status').textContent = done + ' / ' + n;
  $('bar').style.width = n ? (done/n*100)+'%' : '0';
  const g = $('gate');
  if(ready()){ g.className='gate go'; g.textContent='✓ ครบแล้ว กดบันทึกแล้วออกได้เลยค่ะ'; }
  else{
    const miss=[]; if(n-done) miss.push('ยังไม่ได้ติ๊กอีก '+(n-done)+' ข้อ'); if(!photo[cur]) miss.push('ยังไม่ได้ถ่ายรูป');
    g.className='gate stop'; g.innerHTML='⛔ ยังไม่ครบ อย่าเพิ่งออกจากบ้าน<small>'+miss.join(' · ')+'</small>';
  }
  $('list').innerHTML = T.items.map((t,i)=>`<li><label class="item ${K[i]?'on':''}"><input type="checkbox" data-i="${i}" ${K[i]?'checked':''}><span class="box">${check}</span><span class="txt">${esc(t)}</span></label></li>`).join('');
  document.querySelectorAll('#list input').forEach(cb=>cb.onchange=()=>{ ticks()[cb.dataset.i]=cb.checked; saveLocal(); render(); });
  $('photoLabel').textContent = '📷 ' + (T.photo || 'ถ่ายรูป');
  $('photoBox').classList.toggle('has', !!photo[cur]);
  $('photoPreview').hidden = !photo[cur];
  if(photo[cur]) $('photoPreview').src = photo[cur].dataUrl;
  $('cameraText').textContent = photo[cur] ? '📷 ถ่ายใหม่' : '📷 ถ่ายรูป';
  $('noteLabel').textContent = '📝 ' + (T.note || 'จดไว้กันลืม');
  $('noteText').placeholder = T.placeholder || '';
  $('noteText').value = local.notes[cur] || '';
  $('saveBtn').disabled = !ready() || busy;
  $('saveBtn').textContent = busy ? 'กำลังบันทึก…' : 'บันทึก พร้อมออก';
  const lp = $('lastPark'), park = local.last.park;
  if(cur==='back' && park){ lp.hidden=false; lp.innerHTML = (park.thumb?`<img src="${park.thumb}" alt="รูปที่จอดรถ">`:'') + `<div><b>จอดไว้ล่าสุด</b><br>${esc(park.note||'ไม่ได้จดชั้น')}<br><span class="tip">${esc(park.when)}</span></div>`; }
  else lp.hidden = true;
}

function showToast(m,k){ const t=$('toast'); t.className='toast '+(k||'ok'); t.textContent=m; t.hidden=false; }
function hideToast(){ $('toast').hidden=true; }

function shrink(file, max, q){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{ const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)); const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',q)); };
    img.onerror = e=>{ URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}
$('photoInput').addEventListener('change', async e=>{
  const f = e.target.files && e.target.files[0]; e.target.value='';
  if(!f) return;
  try{ photo[cur] = {dataUrl: await shrink(f,1280,0.72), thumb: await shrink(f,200,0.6)}; hideToast(); render(); }
  catch(err){ showToast('เปิดรูปนี้ไม่ได้ ลองถ่ายใหม่อีกครั้งค่ะ','warn'); }
});
$('noteText').addEventListener('input', ()=>{ local.notes[cur] = $('noteText').value; saveLocal(); });
$('resetBtn').onclick = ()=>{ local.ticks[cur]=[]; delete photo[cur]; hideToast(); saveLocal(); render(); };

$('saveBtn').onclick = async ()=>{
  if(!ready() || busy) return;
  const T = tab(); busy = true; hideToast(); render();
  try{
    const r = await api({action:'save', idToken: liff.getIDToken(), tabKey:T.key, tabName:T.name, items:T.items,
      note:(local.notes[cur]||'').trim(), photo:{type:'image/jpeg', data: photo[cur].dataUrl.split(',')[1]}});
    if(r.ok){
      if(cur==='park') local.last.park = {note:(local.notes[cur]||'').trim(), thumb:photo[cur].thumb, when:new Date().toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})};
      local.ticks[cur]=[]; local.notes[cur]=''; delete photo[cur]; saveLocal();
      showToast('บันทึกแล้ว เวลา '+r.time+' น. ออกได้เลยค่ะ');
    } else if(r.error==='auth'){
      showToast('ต้องยืนยันตัวตนใหม่ กรุณาปิดแล้วเปิดแอปจาก LINE อีกครั้งค่ะ','warn');
    } else {
      showToast('บันทึกไม่สำเร็จ ลองกดอีกครั้งค่ะ','warn');
    }
  }catch(err){ showToast('ส่งข้อมูลไม่สำเร็จ เช็กอินเทอร์เน็ตแล้วกดอีกครั้งค่ะ','warn'); }
  finally{ busy=false; render(); }
};

$('histBtn').onclick = async ()=>{
  $('hist').innerHTML = '<div class="tip">กำลังโหลด…</div>';
  try{
    const r = await api({action:'history', idToken: liff.getIDToken()});
    if(!r.ok){ $('hist').innerHTML = '<div class="tip">โหลดประวัติไม่สำเร็จ ลองเปิดแอปใหม่ค่ะ</div>'; return; }
    if(!r.logs.length){ $('hist').innerHTML = '<div class="tip">ยังไม่มีบันทึกค่ะ</div>'; return; }
    $('hist').innerHTML = '<div style="display:flex;flex-direction:column;gap:8px">' + r.logs.map(l=>`<div class="log"><span class="when">${esc(l.date)} · ${esc(l.time)} น.</span><span>${esc(l.tabName)} · ครบ ${esc(l.count)} ข้อ</span>${l.note?`<span class="note">${esc(l.note)}</span>`:''}</div>`).join('') + '</div>';
  }catch(e){ $('hist').innerHTML = '<div class="tip">โหลดประวัติไม่สำเร็จ ลองใหม่อีกครั้งค่ะ</div>'; }
};

start();
</script>
</body>
</html>
